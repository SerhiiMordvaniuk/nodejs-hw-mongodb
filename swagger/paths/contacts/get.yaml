tags:
  - Contacts

summary: Get list of contacts
operationId: getContacts
description: Get list of all contacts for authorized user

security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 5
  - in: query
    name: sortBy
    schema:
      type: string
      enum: ['_id', 'name', 'isFavourite', 'contactType']
      example: 'name'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
  - in: query
    name: type
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: 'work'
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true

responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - page
                - perPage
                - totalPages
                - totalItems
                - hasNextPage
                - hasPreviousPage
                - data
              properties:
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 2
                totalPages:
                  type: number
                  example: 3
                totalItems:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'

  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
