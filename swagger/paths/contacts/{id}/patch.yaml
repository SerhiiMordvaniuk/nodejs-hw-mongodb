tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: Patch a contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 67f7a6e3d893277118aec079
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object

        properties:
          name:
            description: Contact's name
            type: string
            example: John Doe
          phoneNumber:
            description: Contact's phoneNumber
            type: string
            example: '+380000000000'
          email:
            description: Contact's email
            type: string
            example: lalala@gmail.com
          isFavourite:
            description: Whether is contact is favourite
            type: boolean
            example: true
          contactType:
            description: Contact's type
            type: string
            enum: ['work', 'home', 'personal']
            example: home
          photo:
            description: Contact's photo
            type: string
            format: binary

responses:
  '200':
    description: Patched a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
